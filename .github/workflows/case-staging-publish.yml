name: case-staging-publish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case-staging-publish.yml
      - .dockerignore
      - containers/case-runtime/**
      - package.json
      - package-lock.json
      - scripts/publish-case-image-from-oci.mjs
      - src/**
  workflow_dispatch:

# This workflow is the only planned publisher identity for the loopback Case
# image inventory. It has no cluster, Flux, runtime Secret, civic-data, or
# treasury credential.
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: case-staging-publish-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'GiraeffleAeffle/stadtstack'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: case-steward-control
            image: ghcr.io/giraeffleaeffle/stadtstack-case-steward-control
            sourceClosure: containers/case-runtime/case-steward-control-source-closure.txt
          - component: case-public-binding
            image: ghcr.io/giraeffleaeffle/stadtstack-case-public-binding
            sourceClosure: containers/case-runtime/case-public-binding-source-closure.txt
          - component: case-restore-verifier
            image: ghcr.io/giraeffleaeffle/stadtstack-case-restore-verifier
            sourceClosure: ""
    steps:
      - name: Require the reviewed publisher ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" != ""
          test "${#GITHUB_SHA}" -eq 40
          case "$GITHUB_SHA" in *[!0-9a-f]*) exit 1;; esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Materialize a closed build context from the reviewed source revision
        id: context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          context="$RUNNER_TEMP/case-build-context"
          rm -rf "$context"
          mkdir -p "$context"
          source_closure='${{ matrix.sourceClosure }}'
          context_files=(.dockerignore containers/case-runtime/Containerfile containers/case-runtime/activation-blocked.mjs)
          source_files=()
          if test "$source_closure" != ""; then
            test -f "$source_closure"
            mapfile -t source_files < "$source_closure"
            source_paths="$(printf '%s\n' "${source_files[@]}")"
            test "$source_paths" = "$(printf '%s\n' "${source_files[@]}" | LC_ALL=C sort -u)"
            while IFS= read -r path; do
              [[ "$path" =~ ^src/[a-z0-9/-]+\.ts$ ]]
              test -f "$path"
            done <<< "$source_paths"
            case "${{ matrix.component }}" in
              case-steward-control)
                context_files+=(package.json package-lock.json containers/case-runtime/runtime-entrypoint-common.mjs containers/case-runtime/case-steward-control-entrypoint.mjs "$source_closure")
                ;;
              case-public-binding)
                context_files+=(package.json package-lock.json containers/case-runtime/runtime-entrypoint-common.mjs containers/case-runtime/case-public-binding-entrypoint.mjs "$source_closure")
                ;;
              *) exit 1 ;;
            esac
          else
            test "${{ matrix.component }}" = "case-restore-verifier"
          fi
          git archive --format=tar "$GITHUB_SHA" -- "${context_files[@]}" "${source_files[@]}" | tar -xf - -C "$context"
          expected="$(printf '%s\n' "${context_files[@]}" "${source_files[@]}" | LC_ALL=C sort)"
          actual="$(find "$context" -type f | sed "s#^$context/##" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          while IFS= read -r path; do
            test "$(git show "$GITHUB_SHA:$path" | sha256sum | cut -d' ' -f1)" = "$(sha256sum "$context/$path" | cut -d' ' -f1)"
          done <<< "$expected"
          echo "path=$context" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build one closed local OCI archive
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ steps.context.outputs.path }}
          file: containers/case-runtime/Containerfile
          push: false
          platforms: linux/amd64
          build-args: |
            SOURCE_REPOSITORY=https://github.com/GiraeffleAeffle/stadtstack
            SOURCE_REVISION=${{ github.sha }}
          target: ${{ matrix.component }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.component }}.oci.tar,name=stadtstack.local/stadtstack-case/${{ matrix.component }}:source-${{ github.sha }},annotation.io.containerd.image.name=stadtstack.local/stadtstack-case/${{ matrix.component }}:source-${{ github.sha }},rewrite-timestamp=true
          cache-from: type=gha,scope=stadtstack-case-runtime
          cache-to: type=gha,mode=max,scope=stadtstack-case-runtime
          provenance: false
          sbom: false
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.3.0
      - name: Publish or reuse the exact immutable source tag
        id: publish
        env:
          ARCHIVE: ${{ runner.temp }}/${{ matrix.component }}.oci.tar
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ matrix.image }}
          SOURCE_TAG: source-${{ github.sha }}
          LOCAL_REFERENCE: source-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(node scripts/publish-case-image-from-oci.mjs \
            --archive "$ARCHIVE" \
            --local-reference "$LOCAL_REFERENCE" \
            --component "$COMPONENT" \
            --image "$IMAGE" \
            --tag "$SOURCE_TAG")"
          digest="$(node --input-type=module -e 'const value = JSON.parse(process.argv[1]); if (!/^sha256:[a-f0-9]{64}$/.test(value.digest)) process.exit(1); process.stdout.write(value.digest)' "$result")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "status=$(node --input-type=module -e 'process.stdout.write(JSON.parse(process.argv[1]).status)' "$result")" >> "$GITHUB_OUTPUT"
      - name: Produce SPDX 2.3 SBOM for immutable image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.20.8
        with:
          image: ${{ matrix.image }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/${{ matrix.component }}.spdx.json
      - name: Attest GitHub OIDC SLSA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.1.0
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest SPDX 2.3 SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v2.0.0
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: ${{ runner.temp }}/${{ matrix.component }}.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify GitHub OIDC provenance and SPDX evidence
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          WORKFLOW_IDENTITY: https://github.com/GiraeffleAeffle/stadtstack/.github/workflows/case-staging-publish.yml@refs/heads/main
        shell: bash
        run: |
          set -euo pipefail
          for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
            gh attestation verify "oci://$IMAGE@$DIGEST" \
              --repo GiraeffleAeffle/stadtstack \
              --cert-identity "$WORKFLOW_IDENTITY" \
              --source-digest "$GITHUB_SHA" \
              --source-ref refs/heads/main \
              --predicate-type "$predicate" \
              --bundle-from-oci
          done
      - name: Verify anonymous immutable tag and digest pulls
        env:
          ARCHIVE: ${{ runner.temp }}/${{ matrix.component }}.oci.tar
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ matrix.image }}
          SOURCE_TAG: source-${{ github.sha }}
          LOCAL_REFERENCE: source-${{ github.sha }}
          ANONYMOUS_REGISTRY_CONFIG: ${{ runner.temp }}/oras-anonymous-registry.json
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"auths":{}}' > "$ANONYMOUS_REGISTRY_CONFIG"
          mkdir -p "$RUNNER_TEMP/oras-anonymous"
          DOCKER_CONFIG="$RUNNER_TEMP/oras-anonymous" node scripts/publish-case-image-from-oci.mjs \
            --archive "$ARCHIVE" \
            --local-reference "$LOCAL_REFERENCE" \
            --component "$COMPONENT" \
            --image "$IMAGE" \
            --tag "$SOURCE_TAG" \
            --anonymous-registry-config "$ANONYMOUS_REGISTRY_CONFIG"
